<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ef2b0"/>
      <stop offset="0.55" stop-color="#3bc4f7"/>
      <stop offset="1" stop-color="#8f7cf8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ef2b0"/>
      <stop offset="0.5" stop-color="#3bc4f7"/>
      <stop offset="1" stop-color="#8f7cf8"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="#04060a"/>
    <g filter="url(#blur)" opacity="0.75">
      <ellipse cx="330" cy="330" rx="320" ry="90" fill="#3ef2b0" transform="rotate(-12 330 330)"/>
      <ellipse cx="900" cy="300" rx="300" ry="80" fill="#3bc4f7" transform="rotate(10 900 300)"/>
      <ellipse cx="640" cy="380" rx="220" ry="70" fill="#8f7cf8"/>
    </g>
    <g transform="translate(640 128)">
      <rect x="-34" y="-34" width="68" height="68" rx="20" fill="url(#ring)"/>
      <circle r="16" fill="#04060a"/>
    </g>
    <text x="640" y="250" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-3" fill="#f4f7fb">Aurora <tspan fill="url(#text)">VPN</tspan></text>
    <text x="640" y="306" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#a7b0c0">Вставьте свой ключ и нажмите одну кнопку</text>
  </g>
</svg>
